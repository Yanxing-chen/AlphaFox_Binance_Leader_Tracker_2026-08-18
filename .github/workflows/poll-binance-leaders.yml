name: Poll Binance leaders

on:
  schedule:
    # GitHub scheduled runs can be delayed or dropped around crowded minute marks.
    # Offset from :00/:05/:10 to improve reliability while keeping a 5-minute cadence.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        trader:
          - id: "5075281354358777856"
            label: "熬鹰资本"
          - id: "5108371059752839168"
            label: "鎏渊"
          - id: "5121666018948220416"
            label: "趋势交易王"
          - id: "5175036213074191105"
            label: "如何设置低于10万U不能跟我的单"
          - id: "4788776444236355328"
            label: "星辰社区-意钦"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ${{ matrix.trader.label }} and ingest to Cloudflare D1
        run: node cloudflare/scripts/fetch_and_ingest.js
        env:
          LEADER_TRACKER_INGEST_URL: ${{ secrets.LEADER_TRACKER_INGEST_URL }}
          LEADER_TRACKER_AUTH_MODE: github-oidc
          LEADER_TRACKER_OIDC_AUDIENCE: leader-tracker-ingest
          TRADER_IDS: ${{ matrix.trader.id }}
          PAGE_SIZE: "100"
          BACKFILL_PAGES: "6"
