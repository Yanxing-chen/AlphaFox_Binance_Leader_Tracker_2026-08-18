name: Poll Binance leaders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        trader:
          - id: "5075281354358777856"
            label: "熬鹰资本"
          - id: "5108371059752839168"
            label: "鎏渊"
          - id: "5121666018948220416"
            label: "趋势交易王"
          - id: "5142214769055593984"
            label: "Rainbow88"
          - id: "5098677138323805440"
            label: "geddong"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ${{ matrix.trader.label }} and ingest to Cloudflare D1
        run: node cloudflare/scripts/fetch_and_ingest.js
        env:
          LEADER_TRACKER_INGEST_URL: ${{ secrets.LEADER_TRACKER_INGEST_URL }}
          LEADER_TRACKER_INGEST_SECRET: ${{ secrets.LEADER_TRACKER_INGEST_SECRET }}
          TRADER_IDS: ${{ matrix.trader.id }}
          PAGE_SIZE: "100"
          BACKFILL_PAGES: "6"
