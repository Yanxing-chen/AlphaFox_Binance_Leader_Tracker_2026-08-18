<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binance 带单员追踪台</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --ink: #141414;
      --muted: #74777f;
      --line: #e8ebef;
      --soft: #f1f3f5;
      --yellow: #f4c21b;
      --green: #24b77a;
      --red: #eb4d66;
      --blue: #246fe5;
      --cyan: #1fa8c9;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100svh; overflow-y: auto; }
    button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .shell { width: min(100%, 1240px); margin: 0 auto; padding: 22px; display: grid; gap: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
    .left-head { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .menu-btn { width: 42px; height: 42px; border-radius: var(--radius); display: grid; place-items: center; background: var(--soft); font-size: 22px; font-weight: 800; }
    .trader-menu { position: absolute; left: 0; top: 52px; width: 260px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 14px 36px rgba(0,0,0,.12); display: none; z-index: 20; }
    .trader-menu.open { display: grid; gap: 6px; }
    .trader-option { min-height: 42px; padding: 9px 10px; border-radius: 7px; text-align: left; display: grid; gap: 2px; }
    .trader-option.active { background: #fff6cf; }
    .trader-option strong { font-size: 14px; font-weight: 760; }
    .trader-option span { color: var(--muted); font-size: 12px; }
    .identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--soft); }
    h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 780; letter-spacing: 0; }
    h2 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 760; letter-spacing: 0; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn { min-height: 36px; padding: 8px 12px; border-radius: var(--radius); background: var(--soft); font-size: 14px; font-weight: 700; }
    .btn.primary { background: var(--yellow); color: #171717; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .leader { padding: 18px; display: grid; gap: 16px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { min-height: 26px; display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 6px; background: var(--soft); color: #565d67; font-size: 12px; font-weight: 650; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; }
    .kpi { background: #fbfbfc; padding: 14px; display: grid; gap: 7px; min-width: 0; }
    .kpi .value { font-size: 19px; font-weight: 740; }
    .label { color: var(--muted); font-size: 13px; line-height: 1.2; }
    .value { font-size: 20px; line-height: 1.18; font-weight: 760; overflow-wrap: anywhere; letter-spacing: 0; }
    .value.small { font-size: 16px; }
    .unit { display: inline; margin-left: 5px; font-size: 13px; line-height: 1; font-weight: 650; vertical-align: baseline; }
    .good { color: var(--green); }
    .bad { color: var(--red); }
    .tabs { display: flex; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
    .tab { flex: 0 0 auto; min-height: 38px; padding: 9px 14px; border-radius: 7px; color: var(--muted); font-size: 15px; font-weight: 720; white-space: nowrap; }
    .tab.active { background: var(--yellow); color: var(--ink); }
    .content { display: grid; gap: 16px; }
    .section-head { padding: 15px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-body { padding: 16px; }
    .grid-2 { display: grid; grid-template-columns: minmax(680px, 1.35fr) minmax(320px, .65fr); gap: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; display: grid; gap: 7px; min-width: 0; }
    .chart-wrap { height: 270px; }
    .chart { width: 100%; height: 100%; display: block; }
    .asset-list { display: grid; gap: 12px; }
    .asset-row { display: grid; grid-template-columns: 72px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
    .bar { height: 9px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
    .position-card { padding: 16px; display: grid; gap: 16px; }
    .symbol-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 19px; font-weight: 760; letter-spacing: 0; }
    .chip { min-height: 25px; padding: 5px 8px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 12px; line-height: 1; font-weight: 720; background: var(--soft); color: #5d6470; }
    .chip.short { background: var(--red); color: #fff; }
    .chip.long { background: var(--green); color: #fff; }
    .chip.partial { background: #fff3bf; color: #7a5a00; }
    .chip.closed { background: #eef1f4; color: #565d67; }
    .position-main { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 880px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-size: 13px; }
    th { color: var(--muted); background: #fbfbfc; font-size: 12px; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    .record-list { display: grid; gap: 10px; }
    .record { border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
    .record p { margin: 8px 0 0; color: #333; line-height: 1.5; font-size: 13px; }
    .empty { padding: 42px 16px; color: var(--muted); text-align: center; font-weight: 650; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .sim-layout { display: grid; grid-template-columns: minmax(360px, .72fr) minmax(560px, 1.28fr); gap: 16px; }
    .sim-stack { display: grid; gap: 12px; }
    .sim-summary { display: grid; gap: 12px; }
    .sim-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .sim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sim-ledger { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
    .sim-event { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 4px; background: #fff; }
    .sim-event strong { font-size: 13px; }
    .sim-event span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .sim-position-list { display: grid; gap: 10px; }
    .sim-position { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; }
    .sim-position-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .setup-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, .55fr); gap: 16px; }
    .setup-form { display: grid; gap: 14px; }
    .form-block { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; background: #fff; }
    .form-block h3 { margin: 0; font-size: 14px; line-height: 1.2; }
    .form-block.subtle { background: #fffdf2; border-color: #f4e4a3; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label { color: var(--muted); font-size: 12px; line-height: 1.25; }
    .field input, .field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fbfbfc;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #d0a500; box-shadow: 0 0 0 3px rgba(244,194,27,.16); }
    .field input[type="range"] { padding: 0; min-height: 22px; accent-color: var(--yellow); background: transparent; border: 0; box-shadow: none; }
    .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .field-head output { font-size: 12px; font-weight: 760; color: var(--ink); }
    .segmented { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: var(--radius); background: var(--soft); }
    .segmented button { min-height: 36px; border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 720; }
    .segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
    .switch-row:first-child { border-top: 0; padding-top: 0; }
    .switch-row strong { font-size: 13px; }
    .switch-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .switch { width: 44px; height: 24px; border-radius: 999px; background: #dfe4ea; padding: 3px; flex: 0 0 auto; }
    .switch i { display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .18s ease; }
    .switch.active { background: var(--yellow); }
    .switch.active i { transform: translateX(20px); }
    .preview-list { display: grid; gap: 9px; }
    .preview-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .preview-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .preview-row span { color: var(--muted); font-size: 12px; }
    .preview-row strong { font-size: 15px; text-align: right; }
    .plain-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .rule-list { display: grid; gap: 9px; }
    .rule { display: grid; gap: 3px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
    .rule:last-child { border-bottom: 0; padding-bottom: 0; }
    .rule strong { font-size: 13px; }
    .rule p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .mode-fields[hidden] { display: none; }
    .mobile-cards { display: none; }
    .history-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; background: #fff; }
    .history-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .history-symbol { font-size: 16px; font-weight: 760; letter-spacing: 0; }
    .history-pnl { font-size: 18px; font-weight: 760; text-align: right; white-space: nowrap; }
    .history-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .mini-field { display: grid; gap: 3px; min-width: 0; }
    .mini-field span { color: var(--muted); font-size: 11px; line-height: 1.2; }
    .mini-field strong { font-size: 13px; line-height: 1.25; font-weight: 710; overflow-wrap: anywhere; }
    .mobile-meta { display: none; }
    @media (max-width: 900px) {
      .shell { padding: 14px; }
      .topbar { align-items: flex-start; }
      .kpis, .metrics, .position-main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      body { background: #f5f6f8; overflow-x: hidden; }
      .shell { width: 100%; padding: 10px 10px 28px; gap: 10px; overflow-x: hidden; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        margin: 0 -10px;
        padding: 10px 82px 8px 10px;
        align-items: center;
        gap: 8px;
        background: rgba(245,246,248,.96);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(232,235,239,.7);
      }
      .left-head { flex: 1 1 0; min-width: 0; gap: 8px; }
      .menu-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--line);
        font-size: 18px;
        box-shadow: 0 6px 18px rgba(20,20,20,.05);
      }
      .identity { gap: 8px; min-width: 0; }
      .identity > div { min-width: 0; }
      .avatar { width: 40px; height: 40px; }
      h1 { max-width: 42vw; font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub {
        max-width: 52vw;
        font-size: 11px;
        line-height: 1.32;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .desktop-meta { display: none; }
      .mobile-meta { display: inline; }
      .actions { position: absolute; top: 10px; right: 10px; flex: 0 0 auto; gap: 6px; }
      #scrollTop { display: none; }
      .btn { min-height: 34px; padding: 8px 10px; border-radius: 10px; font-size: 13px; white-space: nowrap; }
      .btn.primary { padding-inline: 11px; }
      .trader-menu {
        position: fixed;
        left: 10px;
        top: 58px;
        width: min(300px, calc(100vw - 20px));
        border-radius: 12px;
        box-shadow: 0 18px 48px rgba(0,0,0,.18);
      }
      .leader { padding: 12px; gap: 12px; border-radius: 12px; }
      .tag-row { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 2px; scrollbar-width: none; }
      .tag-row::-webkit-scrollbar { display: none; }
      .tag { flex: 0 0 auto; min-height: 24px; padding: 4px 7px; border-radius: 6px; font-size: 11px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; background: transparent; border-radius: 0; }
      .kpi { min-height: 74px; padding: 11px 10px; gap: 5px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .kpi .value { font-size: 18px; }
      .kpi .value.small { font-size: 13px; line-height: 1.25; }
      .label { font-size: 11px; }
      .value { font-size: 18px; }
      .unit { margin-left: 3px; font-size: 10px; }
      .tabs {
        position: sticky;
        top: 63px;
        z-index: 24;
        padding: 6px;
        gap: 4px;
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(20,20,20,.05);
      }
      .tab { flex: 1 1 0; min-width: 0; min-height: 34px; padding: 7px 4px; border-radius: 8px; font-size: 12px; text-align: center; }
      .panel { border-radius: 12px; }
      .section-head { padding: 12px; align-items: flex-start; }
      .section-head .note { display: none; }
      .section-body { padding: 12px; }
      .grid-2 { gap: 10px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .metrics .metric:nth-child(-n + 3) { grid-column: 1 / -1; }
      .metric { padding: 10px; gap: 5px; border-radius: 10px; }
      .metric .value { font-size: 17px; }
      .chart-wrap { height: 190px; }
      .asset-row { grid-template-columns: 60px 1fr 54px; gap: 8px; font-size: 12px; }
      .sim-layout { grid-template-columns: 1fr; gap: 10px; }
      .sim-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .sim-position-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .sim-ledger { max-height: none; }
      .setup-grid { grid-template-columns: 1fr; gap: 10px; }
      .field-grid { grid-template-columns: 1fr; gap: 8px; }
      .form-block { padding: 12px; border-radius: 12px; }
      .segmented button { font-size: 12px; }
      .position-card { margin-bottom: 10px; padding: 12px; gap: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
      .symbol-line { gap: 6px; font-size: 17px; }
      .chip { min-height: 22px; padding: 4px 7px; border-radius: 6px; font-size: 11px; }
      .position-main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .desktop-table { display: none; }
      .mobile-cards { display: grid; gap: 10px; padding: 12px; }
      .history-card { border-radius: 12px; }
      .history-pnl { font-size: 17px; }
      .record-list { gap: 8px; }
      .record { grid-template-columns: 1fr; gap: 10px; padding: 12px; border-radius: 12px; }
      .record p { font-size: 12px; line-height: 1.55; }
      .empty { padding: 28px 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="left-head">
        <button class="menu-btn" id="menuBtn" aria-label="切换交易员">☰</button>
        <div class="identity">
          <img class="avatar" id="avatar" alt="" />
          <div>
            <h1 id="name">带单员追踪台</h1>
            <div class="sub" id="meta">等待数据</div>
          </div>
        </div>
        <div class="trader-menu" id="traderMenu"></div>
      </div>
      <div class="actions">
        <button class="btn" id="scrollTop">回到顶部</button>
        <button class="btn primary" id="pollBtn">立即刷新</button>
      </div>
    </header>

    <section class="panel leader">
      <div class="tag-row" id="tags"></div>
      <div class="kpis">
        <div class="kpi"><span class="label">带单余额 USDT</span><strong class="value" id="marginBalance">--</strong></div>
        <div class="kpi"><span class="label">资产管理规模 USDT</span><strong class="value" id="aum">--</strong></div>
        <div class="kpi"><span class="label">跟单用户</span><strong class="value" id="copiers">--</strong></div>
        <div class="kpi"><span class="label">最近交易</span><strong class="value small" id="lastTrade">--</strong></div>
      </div>
    </section>

    <nav class="tabs" aria-label="栏目">
      <button class="tab active" data-tab="performance">项目表现</button>
      <button class="tab" data-tab="positions">持有仓位</button>
      <button class="tab" data-tab="history">仓位历史</button>
      <button class="tab" data-tab="records">最新记录</button>
      <button class="tab" data-tab="simulator">模拟跟单</button>
    </nav>

    <section class="content" id="content"></section>
  </main>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const content = $("#content");
    let snapshot = null;
    const initialTab = new URLSearchParams(window.location.search).get("tab");
    const tabs = ["performance", "positions", "history", "records", "simulator"];
    let activeTab = tabs.includes(initialTab) ? initialTab : "performance";
    let activePortfolioId = localStorage.getItem("activePortfolioId") || "5075281354358777856";
    let traderList = [];
    const SIM_STORAGE_KEY = "leaderTrackerSimulations:v2";
    const SIM_STARTING_BALANCE = 10000;
    const DEFAULT_SIM_CONFIG = {
      followMode: "proportional",
      fixedNotional: 100,
      maxLeverage: 10,
      maxSlippagePct: 0.5,
      maxOrderNotional: 0,
      accountTakeProfitPct: 0,
      accountStopLossPct: 0,
      maxDrawdownPct: 0,
      positionTakeProfitPct: 0,
      positionStopLossPct: 0,
      trailingStopPct: 0,
      onlyNewOrders: true,
      chaseExisting: false
    };
    let simulations = readSimulations();

    function num(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
    function fmt(value, digits = 2) { return num(value).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    function trim(value, digits = 4) { return num(value).toLocaleString("en-US", { maximumFractionDigits: digits }); }
    function signed(value, digits = 2, unit = "") { const safe = num(value); return `${safe >= 0 ? "+" : ""}${fmt(safe, digits)}${unit}`; }
    function compact(value) { const safe = num(value); const abs = Math.abs(safe); if (abs >= 1_000_000) return `${fmt(safe / 1_000_000, 2)}M`; if (abs >= 1_000) return `${fmt(safe / 1_000, 1)}K`; return fmt(safe, 2); }
    function dt(ms) { if (!ms) return "--"; const d = new Date(num(ms)); const p = (v) => String(v).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
    function pnlClass(value) { return num(value) >= 0 ? "good" : "bad"; }
    function sideText(side) { return String(side).toUpperCase() === "LONG" ? "多" : "空"; }
    function sideClass(side) { return String(side).toUpperCase() === "LONG" ? "long" : "short"; }
    function historyStatusClass(status) { return status === "部分平仓" ? "partial" : "closed"; }
    function remainingQtyText(item) { return num(item.remainingQty) > 0 ? `${trim(item.remainingQty, 4)} ${item.baseAsset}` : "--"; }
    function orderAction(order) {
      const pos = String(order.positionSide || "").toUpperCase();
      const side = String(order.side || "").toUpperCase();
      const open = (pos === "LONG" && side === "BUY") || (pos === "SHORT" && side === "SELL");
      return `${open ? "开" : "平"}${sideText(pos)}`;
    }

    function estimateLiquidationPrice(pos, lev) {
      if (!lev || lev <= 0 || !pos.avgPrice) return 0;
      const buffer = 0.9 / lev;
      return String(pos.side).toUpperCase() === "SHORT"
        ? pos.avgPrice * (1 + buffer)
        : pos.avgPrice * Math.max(0, 1 - buffer);
    }

    function readSimulations() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SIM_STORAGE_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveSimulations() {
      localStorage.setItem(SIM_STORAGE_KEY, JSON.stringify(simulations));
    }

    function currentSimulation() {
      return simulations[activePortfolioId] || null;
    }

    function fieldNumber(id, fallback = 0) {
      const element = document.getElementById(id);
      const parsed = Number(element?.value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function fieldText(id, fallback = "") {
      const value = document.getElementById(id)?.value;
      return value && String(value).trim() ? String(value).trim() : fallback;
    }

    function activeFollowMode() {
      return document.querySelector("[data-follow-mode].active")?.dataset.followMode || "proportional";
    }

    function buildConfigFromForm() {
      return {
        ...DEFAULT_SIM_CONFIG,
        followMode: activeFollowMode(),
        fixedNotional: Math.max(1, fieldNumber("simFixedNotional", DEFAULT_SIM_CONFIG.fixedNotional)),
        maxLeverage: Math.max(0, fieldNumber("simMaxLeverage", DEFAULT_SIM_CONFIG.maxLeverage)),
        maxSlippagePct: Math.max(0, fieldNumber("simMaxSlippage", DEFAULT_SIM_CONFIG.maxSlippagePct)),
        maxOrderNotional: Math.max(0, fieldNumber("simMaxOrderNotional", DEFAULT_SIM_CONFIG.maxOrderNotional)),
        accountTakeProfitPct: Math.max(0, fieldNumber("simAccountTakeProfit", DEFAULT_SIM_CONFIG.accountTakeProfitPct)),
        accountStopLossPct: Math.max(0, fieldNumber("simAccountStopLoss", DEFAULT_SIM_CONFIG.accountStopLossPct)),
        maxDrawdownPct: Math.max(0, fieldNumber("simMaxDrawdown", DEFAULT_SIM_CONFIG.maxDrawdownPct)),
        positionTakeProfitPct: Math.max(0, fieldNumber("simPositionTakeProfit", DEFAULT_SIM_CONFIG.positionTakeProfitPct)),
        positionStopLossPct: Math.max(0, fieldNumber("simPositionStopLoss", DEFAULT_SIM_CONFIG.positionStopLossPct)),
        trailingStopPct: Math.max(0, fieldNumber("simTrailingStop", DEFAULT_SIM_CONFIG.trailingStopPct)),
        onlyNewOrders: true,
        chaseExisting: false
      };
    }

    function simOrderKey(order) {
      return [
        order.orderUpdateTime || order.time || "",
        order.symbol || "",
        order.side || "",
        order.positionSide || "",
        order.avgPrice || order.price || "",
        order.executedQty || order.qty || ""
      ].join("|");
    }

    function orderQty(order) {
      return num(order.executedQty ?? order.qty);
    }

    function orderPrice(order) {
      return num(order.avgPrice ?? order.price);
    }

    function orderTime(order) {
      return num(order.orderUpdateTime || order.orderTime || order.time);
    }

    function isOpenOrder(order) {
      const pos = String(order.positionSide || "").toUpperCase();
      const side = String(order.side || "").toUpperCase();
      return (pos === "LONG" && side === "BUY") || (pos === "SHORT" && side === "SELL");
    }

    function markMap(data) {
      const map = new Map();
      for (const pos of data.positions || []) {
        map.set(`${pos.symbol}|${String(pos.side).toUpperCase()}`, num(pos.markPrice || pos.avgPrice));
      }
      return map;
    }

    function startSimulation() {
      if (!snapshot) return;
      const detail = snapshot.detail || {};
      const leaderBalance = Math.max(1, num(snapshot.marginBalance));
      const initialBalance = Math.min(100000, Math.max(100, fieldNumber("simInitialBalance", SIM_STARTING_BALANCE)));
      const config = buildConfigFromForm();
      const sim = {
        version: 2,
        portfolioId: activePortfolioId,
        label: detail.nickname || traderList.find((item) => item.portfolioId === activePortfolioId)?.label || "带单员",
        accountName: fieldText("simAccountName", `模拟盘 ${new Date().toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" })}`),
        status: "active",
        startedAt: Date.now(),
        initialBalance,
        realizedBalance: initialBalance,
        realizedPnl: 0,
        copyRatio: initialBalance / leaderBalance,
        peakEquity: initialBalance,
        config,
        processed: {},
        positions: {},
        events: []
      };
      pushSimEvent(sim, "开始模拟跟单", "不追启动前已经存在的仓位，只处理之后出现的新开仓信号", 0, sim.startedAt);
      simulations[activePortfolioId] = sim;
      saveSimulations();
      renderActive();
    }

    function stopSimulation() {
      const sim = currentSimulation();
      if (!sim) return;
      sim.status = "paused";
      sim.pausedAt = Date.now();
      saveSimulations();
      renderActive();
    }

    function resumeSimulation() {
      const sim = currentSimulation();
      if (!sim) return;
      sim.status = "active";
      sim.resumedAt = Date.now();
      saveSimulations();
      renderActive();
    }

    function resetSimulation() {
      delete simulations[activePortfolioId];
      saveSimulations();
      renderActive();
    }

    function processSimulation(data) {
      const sim = currentSimulation();
      if (!sim || sim.status !== "active") return;
      sim.processed ||= {};
      sim.positions ||= {};
      sim.events ||= [];
      sim.config = { ...DEFAULT_SIM_CONFIG, ...(sim.config || {}) };

      const orders = [...(data.latestOrders || [])]
        .filter((order) => orderTime(order) > sim.startedAt)
        .sort((a, b) => orderTime(a) - orderTime(b));

      for (const order of orders) {
        const key = simOrderKey(order);
        if (sim.processed[key]) continue;
        applySimOrder(sim, order);
        sim.processed[key] = true;
      }

      const marks = markMap(data);
      for (const pos of Object.values(sim.positions)) {
        pos.markPrice = marks.get(`${pos.symbol}|${pos.side}`) || pos.markPrice || pos.avgPrice;
        const roi = positionRoi(pos);
        pos.bestRoi = Math.max(num(pos.bestRoi), roi);
      }
      enforceSimulationRisk(sim);
      sim.lastUpdatedAt = Date.now();
      saveSimulations();
    }

    function applySimOrder(sim, order) {
      const symbol = String(order.symbol || "").toUpperCase();
      const side = String(order.positionSide || "").toUpperCase();
      const leaderQty = orderQty(order);
      const price = orderPrice(order);
      if (!symbol || !side || !leaderQty || !price) return;
      const key = `${symbol}|${side}`;
      const asset = order.baseAsset || symbol.replace(/USDT$/, "");
      const opened = isOpenOrder(order);

      if (opened) {
        const qty = calculateOpenQty(sim, order, price);
        if (!qty) {
          pushSimEvent(sim, `${orderAction(order)} ${symbol}`, `触发最大杠杆或单笔限制，已跳过`, 0, orderTime(order));
          return;
        }
        const pos = sim.positions[key] || {
          symbol,
          baseAsset: asset,
          side,
          qty: 0,
          leaderQty: 0,
          avgPrice: 0,
          markPrice: price,
          openedAt: orderTime(order)
        };
        const nextQty = pos.qty + qty;
        pos.avgPrice = nextQty > 0 ? ((pos.avgPrice * pos.qty) + (price * qty)) / nextQty : price;
        pos.qty = nextQty;
        pos.leaderQty = num(pos.leaderQty) + leaderQty;
        pos.markPrice = price;
        pos.bestRoi = Math.max(num(pos.bestRoi), positionRoi(pos));
        sim.positions[key] = pos;
        pushSimEvent(sim, `${orderAction(order)} ${symbol}`, `数量 ${trim(qty, 4)} ${asset}，均价 ${fmt(price, 5)}`, 0, orderTime(order));
        return;
      }

      const pos = sim.positions[key];
      if (!pos || pos.qty <= 0) {
        pushSimEvent(sim, `${orderAction(order)} ${symbol}`, `这是启动前旧仓位的平仓，本模拟账户没有追入，已跳过`, 0, orderTime(order));
        return;
      }
      const closeRatio = Math.min(1, leaderQty / Math.max(leaderQty, num(pos.leaderQty)));
      const closeQty = Math.min(pos.qty, pos.qty * closeRatio);
      const pnl = side === "LONG"
        ? (price - pos.avgPrice) * closeQty
        : (pos.avgPrice - price) * closeQty;
      pos.qty -= closeQty;
      pos.leaderQty = Math.max(0, num(pos.leaderQty) - leaderQty);
      pos.markPrice = price;
      sim.realizedPnl = num(sim.realizedPnl) + pnl;
      sim.realizedBalance = num(sim.realizedBalance) + pnl;
      if (pos.qty <= 1e-8) delete sim.positions[key];
      pushSimEvent(sim, `${orderAction(order)} ${symbol}`, `数量 ${trim(closeQty, 4)} ${asset}，均价 ${fmt(price, 5)}`, pnl, orderTime(order));
    }

    function calculateOpenQty(sim, order, price) {
      const config = { ...DEFAULT_SIM_CONFIG, ...(sim.config || {}) };
      let notional = config.followMode === "fixed"
        ? num(config.fixedNotional)
        : orderQty(order) * price * num(sim.copyRatio);
      if (config.maxOrderNotional > 0) notional = Math.min(notional, config.maxOrderNotional);
      if (config.maxLeverage > 0) {
        const summary = simSummary(sim);
        const maxNotional = summary.equity * config.maxLeverage;
        const available = Math.max(0, maxNotional - summary.notional);
        notional = Math.min(notional, available);
      }
      return notional > 0 ? notional / price : 0;
    }

    function positionPnl(pos) {
      const markPrice = num(pos.markPrice || pos.avgPrice);
      return pos.side === "LONG"
        ? (markPrice - pos.avgPrice) * pos.qty
        : (pos.avgPrice - markPrice) * pos.qty;
    }

    function positionRoi(pos) {
      const notional = num(pos.markPrice || pos.avgPrice) * num(pos.qty);
      return notional > 0 ? positionPnl(pos) / notional * 100 : 0;
    }

    function closeSimPosition(sim, key, reason, time = Date.now()) {
      const pos = sim.positions[key];
      if (!pos) return;
      const pnl = positionPnl(pos);
      sim.realizedPnl = num(sim.realizedPnl) + pnl;
      sim.realizedBalance = num(sim.realizedBalance) + pnl;
      pushSimEvent(sim, `${reason} ${pos.symbol}`, `按标记价格 ${fmt(pos.markPrice, 5)} 模拟平仓`, pnl, time);
      delete sim.positions[key];
    }

    function enforceSimulationRisk(sim) {
      const config = { ...DEFAULT_SIM_CONFIG, ...(sim.config || {}) };
      const summary = simSummary(sim);
      sim.peakEquity = Math.max(num(sim.peakEquity || sim.initialBalance), summary.equity);

      for (const [key, pos] of Object.entries(sim.positions || {})) {
        const roi = positionRoi(pos);
        pos.bestRoi = Math.max(num(pos.bestRoi), roi);
        if (config.positionTakeProfitPct > 0 && roi >= config.positionTakeProfitPct) {
          closeSimPosition(sim, key, "单仓止盈", Date.now());
          continue;
        }
        if (config.positionStopLossPct > 0 && roi <= -config.positionStopLossPct) {
          closeSimPosition(sim, key, "单仓止损", Date.now());
          continue;
        }
        if (config.trailingStopPct > 0 && num(pos.bestRoi) > 0 && num(pos.bestRoi) - roi >= config.trailingStopPct) {
          closeSimPosition(sim, key, "单仓追踪止损", Date.now());
        }
      }

      const afterPositionRisk = simSummary(sim);
      const roi = (afterPositionRisk.equity - num(sim.initialBalance)) / num(sim.initialBalance) * 100;
      const drawdown = sim.peakEquity > 0 ? (sim.peakEquity - afterPositionRisk.equity) / sim.peakEquity * 100 : 0;
      if (config.accountTakeProfitPct > 0 && roi >= config.accountTakeProfitPct) {
        sim.status = "stopped";
        sim.stopReason = `账户止盈 +${fmt(config.accountTakeProfitPct, 2)}%`;
        pushSimEvent(sim, "账户止盈停止跟单", `模拟权益达到 ${fmt(afterPositionRisk.equity, 2)} USDT`, 0, Date.now());
      } else if (config.accountStopLossPct > 0 && roi <= -config.accountStopLossPct) {
        sim.status = "stopped";
        sim.stopReason = `账户止损 -${fmt(config.accountStopLossPct, 2)}%`;
        pushSimEvent(sim, "账户止损停止跟单", `模拟权益跌至 ${fmt(afterPositionRisk.equity, 2)} USDT`, 0, Date.now());
      } else if (config.maxDrawdownPct > 0 && drawdown >= config.maxDrawdownPct) {
        sim.status = "stopped";
        sim.stopReason = `最大回撤 ${fmt(config.maxDrawdownPct, 2)}%`;
        pushSimEvent(sim, "最大回撤停止跟单", `从最高权益回撤 ${fmt(drawdown, 2)}%`, 0, Date.now());
      }
    }

    function pushSimEvent(sim, title, detail, pnl, time) {
      sim.events.unshift({
        title,
        detail,
        pnl,
        time
      });
      sim.events = sim.events.slice(0, 80);
    }

    function simSummary(sim) {
      const positions = Object.values(sim?.positions || {}).map((pos) => {
        const markPrice = num(pos.markPrice || pos.avgPrice);
        const unrealizedPnl = pos.side === "LONG"
          ? (markPrice - pos.avgPrice) * pos.qty
          : (pos.avgPrice - markPrice) * pos.qty;
        return {
          ...pos,
          markPrice,
          notional: markPrice * pos.qty,
          unrealizedPnl
        };
      });
      const unrealizedPnl = positions.reduce((sum, pos) => sum + pos.unrealizedPnl, 0);
      const notional = positions.reduce((sum, pos) => sum + pos.notional, 0);
      const equity = num(sim?.realizedBalance) + unrealizedPnl;
      return {
        positions,
        unrealizedPnl,
        notional,
        equity,
        roi: sim ? (equity - num(sim.initialBalance)) / num(sim.initialBalance) * 100 : 0,
        leverage: equity > 0 ? notional / equity : 0
      };
    }

    function chart(points, field) {
      if (!points || points.length < 2) return `<div class="empty">继续轮询后生成本地曲线</div>`;
      const values = points.map((point) => num(point[field]));
      const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
      const width = 720, height = 250, pad = 30;
      const coords = values.map((value, index) => [pad + index / (values.length - 1) * (width - pad * 2), pad + (max - value) / span * (height - pad * 2)]);
      const line = coords.map(([x, y], index) => `${index ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
      const area = `${line} L${coords.at(-1)[0].toFixed(1)},${height - pad} L${coords[0][0].toFixed(1)},${height - pad} Z`;
      return `<svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#24b77a" stop-opacity=".20"/><stop offset="100%" stop-color="#24b77a" stop-opacity="0"/></linearGradient></defs><line x1="${pad}" y1="${pad}" x2="${width - pad}" y2="${pad}" stroke="#e8ebef"/><line x1="${pad}" y1="${height / 2}" x2="${width - pad}" y2="${height / 2}" stroke="#e8ebef"/><line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#e8ebef"/><path d="${area}" fill="url(#fill)"/><path d="${line}" fill="none" stroke="#24b77a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

        </div>
        <div class="history-grid">
          <div class="mini-field"><span>已平仓量</span><strong>${trim(item.closedQty, 4)} ${item.baseAsset}</strong></div>
          <div class="mini-field"><span>剩余持仓</span><strong>${remainingQtyText(item)}</strong></div>
          <div class="mini-field"><span>开仓价</span><strong>${fmt(item.openPrice, 5)}</strong></div>
          <div class="mini-field"><span>平仓均价</span><strong>${fmt(item.closeAvgPrice, 5)}</strong></div>
          <div class="mini-field"><span>开仓时间</span><strong>${dt(item.openTime)}</strong></div>
          <div class="mini-field"><span>平仓时间</span><strong>${dt(item.closeTime)}</strong></div>
        </div>
      </article>`).join("");
      content.innerHTML = `<section class="panel"><div class="section-head"><h2>仓位历史</h2><span class="note">每次平仓都会记录，部分平仓会显示剩余持仓</span></div><div class="table-wrap desktop-table"><table><thead><tr><th>合约</th><th>方向</th><th>状态</th><th>平仓盈亏</th><th>已平仓量</th><th>剩余持仓</th><th>开仓价</th><th>平仓均价</th><th>开仓时间</th><th>平仓时间</th></tr></thead><tbody>${rows.length ? tableRows : `<tr><td colspan="10"><div class="empty">暂无仓位历史</div></td></tr>`}</tbody></table></div><div class="mobile-cards">${rows.length ? mobileRows : `<div class="empty">暂无仓位历史</div>`}</div></section>`;
    }

    function renderRecords() {
      const orders = snapshot.latestOrders || [];
      content.innerHTML = `<section class="panel"><div class="section-head"><h2>最新交易记录</h2><span class="note">Binance 公开 order-history</span></div><div class="section-body record-list">${orders.length ? orders.map((order) => {
        const qty = num(order.executedQty || order.qty), price = num(order.avgPrice || order.price), value = qty * price, pnl = num(order.totalPnl || order.realizedProfit);
        return `<article class="record"><div><div class="symbol-line"><span class="chip ${sideClass(order.positionSide)}">${orderAction(order)}</span><span>${order.symbol}</span><span class="chip">${order.type || "MARKET"}</span></div><p>均价 ${fmt(price, 5)}，数量 ${trim(qty, 4)} ${order.baseAsset || ""}，名义价值 ${fmt(value, 2)} USDT${pnl ? `，已实现 <strong class="${pnlClass(pnl)}">${signed(pnl, 4)} USDT</strong>` : ""}。</p></div><div class="note">${dt(order.orderUpdateTime || order.time)}</div></article>`;
      }).join("") : `<div class="empty">暂无交易记录</div>`}</div></section>`;
    }

    function renderSimulator() {
      const detail = snapshot.detail || {};
      const sim = currentSimulation();
      if (!sim) {
        const todayName = `模拟盘 ${new Date().toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" })}`;
        const traderName = detail.nickname || traderList.find((item) => item.portfolioId === activePortfolioId)?.label || "Binance 带单员";
        content.innerHTML = `<section class="setup-grid">
          <div class="panel">
            <div class="section-head"><h2>新建模拟跟单</h2><span class="note">普通跟单策略 · 个人纸面账户</span></div>
            <div class="section-body setup-form">
              <div class="form-block">
                <h3>1. 基础配置</h3>
                <div class="field-grid">
                  <div class="field"><label for="simAccountName">账户名称</label><input id="simAccountName" value="${todayName}" /></div>
                  <div class="field"><label for="simInitialBalance">初始资金 USDT</label><input id="simInitialBalance" type="number" min="100" max="100000" step="100" value="${SIM_STARTING_BALANCE}" /></div>
                </div>
                <div class="field">
                  <label>信号源</label>
                  <input value="${traderName} · ${activePortfolioId}" disabled />
                </div>
              </div>

              <div class="form-block">
                <h3>2. 仓位跟随模式</h3>
                <div class="segmented">
                  <button type="button" class="active" data-follow-mode="proportional">等比例跟单</button>
                  <button type="button" data-follow-mode="fixed">同等价值跟单</button>
                </div>
                <p class="plain-note" id="followModeNote">按你的资金与带单员保证金比例缩放仓位，适合想尽量贴近交易员仓位结构的模拟。</p>
                <div class="field-grid mode-fields" id="fixedModeFields" hidden>
                  <div class="field"><label for="simFixedNotional">每次新开仓金额 USDT</label><input id="simFixedNotional" type="number" min="1" step="10" value="100" /></div>
                </div>
                <div class="switch-row">
                  <div><strong>只跟新开仓</strong><span>启动前已经存在的仓位视为错过信号，不按现价补追。</span></div>
                  <button type="button" class="switch active" aria-label="只跟新开仓"><i></i></button>
                </div>
              </div>

              <div class="form-block">
                <h3>3. 下单风控</h3>
                <div class="field-grid">
                  <div class="field"><label for="simMaxLeverage">账户最大杠杆</label><input id="simMaxLeverage" type="number" min="0" step="0.5" value="10" /></div>
                  <div class="field"><label for="simMaxSlippage">最大滑点 %</label><input id="simMaxSlippage" type="number" min="0" step="0.1" value="0.5" /></div>
                  <div class="field"><label for="simMaxOrderNotional">单笔最大跟单金额 USDT，0 为不限</label><input id="simMaxOrderNotional" type="number" min="0" step="10" value="0" /></div>
                </div>
              </div>

              <div class="form-block">
                <h3>4. 账户保护</h3>
                <div class="field-grid">
                  <div class="field"><div class="field-head"><label for="simAccountTakeProfit">账户止盈</label><output for="simAccountTakeProfit">关闭</output></div><input id="simAccountTakeProfit" type="range" min="0" max="100" step="1" value="0" /></div>
                  <div class="field"><div class="field-head"><label for="simAccountStopLoss">账户止损</label><output for="simAccountStopLoss">关闭</output></div><input id="simAccountStopLoss" type="range" min="0" max="80" step="1" value="0" /></div>
                  <div class="field"><div class="field-head"><label for="simMaxDrawdown">最大回撤</label><output for="simMaxDrawdown">关闭</output></div><input id="simMaxDrawdown" type="range" min="0" max="80" step="1" value="0" /></div>
                </div>
                <p class="plain-note">账户保护控制整笔模拟策略。达到条件后会停止继续跟单。</p>
              </div>

              <div class="form-block">
                <h3>5. 单仓保护</h3>
                <div class="field-grid">
                  <div class="field"><div class="field-head"><label for="simPositionTakeProfit">单仓止盈</label><output for="simPositionTakeProfit">关闭</output></div><input id="simPositionTakeProfit" type="range" min="0" max="100" step="1" value="0" /></div>
                  <div class="field"><div class="field-head"><label for="simPositionStopLoss">单仓止损</label><output for="simPositionStopLoss">关闭</output></div><input id="simPositionStopLoss" type="range" min="0" max="80" step="1" value="0" /></div>
                  <div class="field"><div class="field-head"><label for="simTrailingStop">单仓追踪止损</label><output for="simTrailingStop">关闭</output></div><input id="simTrailingStop" type="range" min="0" max="50" step="1" value="0" /></div>
                </div>
                <p class="plain-note">单仓保护只处理某一个合约仓位，不会影响其他仓位。</p>
              </div>
            </div>
          </div>

          <aside class="panel">
            <div class="section-head"><h2>确认并启动</h2><span class="note">不连接真实交易所</span></div>
            <div class="section-body sim-stack">
              <div class="preview-list">
                <div class="preview-row"><span>策略类型</span><strong>普通模拟跟单</strong></div>
                <div class="preview-row"><span>信号源</span><strong>${traderName}</strong></div>
                <div class="preview-row"><span>启动规则</span><strong>只跟新开仓</strong></div>
                <div class="preview-row"><span>数据来源</span><strong>Binance 公开订单</strong></div>
              </div>
              <div class="form-block subtle">
                <h3>执行规则</h3>
                <div class="rule-list">
                  <div class="rule"><strong>不补追旧仓</strong><p>启动前已有仓位会视为错过信号，只处理启动后的新信号。</p></div>
                  <div class="rule"><strong>纸面模拟</strong><p>结果记录在本浏览器中，不连接交易所，也不会触发真实交易。</p></div>
                </div>
              </div>
              <button class="btn primary" id="startSim">保存并启动模拟</button>
            </div>
          </aside>
        </section>`;
        bindSimulatorSetup();
        return;
      }

      const summary = simSummary(sim);
      const config = { ...DEFAULT_SIM_CONFIG, ...(sim.config || {}) };
      const statusText = sim.status === "active" ? "跟单中" : sim.status === "stopped" ? "已停止" : "已暂停";
      content.innerHTML = `<section class="sim-layout">
        <div class="panel sim-summary">
          <div class="section-head"><h2>${sim.accountName || "模拟跟单"}</h2><span class="note">${statusText}${sim.stopReason ? ` · ${sim.stopReason}` : ""}</span></div>
          <div class="section-body sim-stack">
            <div class="sim-grid">
              <div class="metric"><span class="label">模拟权益</span><strong class="value ${pnlClass(summary.equity - sim.initialBalance)}">${fmt(summary.equity, 2)}<span class="unit">USDT</span></strong></div>
              <div class="metric"><span class="label">收益率</span><strong class="value ${pnlClass(summary.roi)}">${signed(summary.roi, 2, "%")}</strong></div>
              <div class="metric"><span class="label">已实现盈亏</span><strong class="value ${pnlClass(sim.realizedPnl)}">${signed(sim.realizedPnl, 2)}<span class="unit">USDT</span></strong></div>
              <div class="metric"><span class="label">未实现盈亏</span><strong class="value ${pnlClass(summary.unrealizedPnl)}">${signed(summary.unrealizedPnl, 2)}<span class="unit">USDT</span></strong></div>
              <div class="metric"><span class="label">持仓名义价值</span><strong class="value">${compact(summary.notional)}<span class="unit">USDT</span></strong></div>
              <div class="metric"><span class="label">账户杠杆</span><strong class="value">${fmt(summary.leverage, 2)}x</strong></div>
              <div class="metric"><span class="label">跟单比例</span><strong class="value">${fmt(sim.copyRatio * 100, 2)}%</strong></div>
              <div class="metric"><span class="label">开始时间</span><strong class="value small">${dt(sim.startedAt)}</strong></div>
            </div>
            <div class="preview-list">
              <div class="preview-row"><span>跟单模式</span><strong>${config.followMode === "fixed" ? `每次 ${fmt(config.fixedNotional, 2)} USDT` : "等比例跟单"}</strong></div>
              <div class="preview-row"><span>最大杠杆</span><strong>${config.maxLeverage > 0 ? `${fmt(config.maxLeverage, 2)}x` : "不限"}</strong></div>
              <div class="preview-row"><span>账户保护</span><strong>${[config.accountTakeProfitPct ? `止盈 ${config.accountTakeProfitPct}%` : "", config.accountStopLossPct ? `止损 ${config.accountStopLossPct}%` : "", config.maxDrawdownPct ? `回撤 ${config.maxDrawdownPct}%` : ""].filter(Boolean).join(" / ") || "关闭"}</strong></div>
              <div class="preview-row"><span>单仓保护</span><strong>${[config.positionTakeProfitPct ? `止盈 ${config.positionTakeProfitPct}%` : "", config.positionStopLossPct ? `止损 ${config.positionStopLossPct}%` : "", config.trailingStopPct ? `追踪 ${config.trailingStopPct}%` : ""].filter(Boolean).join(" / ") || "关闭"}</strong></div>
            </div>
            <div class="sim-actions">
              ${sim.status === "active" ? `<button class="btn" id="stopSim">暂停跟单</button>` : sim.status === "paused" ? `<button class="btn primary" id="resumeSim">继续跟单</button>` : ""}
              <button class="btn" id="resetSim">重置账户</button>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="section-head"><h2>模拟持仓</h2><span class="note">${summary.positions.length} 个仓位</span></div>
          <div class="section-body sim-position-list">
            ${summary.positions.length ? summary.positions.map((pos) => `<article class="sim-position">
              <div class="symbol-line"><span>${pos.symbol}</span><span class="chip ${sideClass(pos.side)}">${sideText(pos.side)}</span><span class="chip">模拟</span></div>
              <div class="sim-position-grid">
                <div class="mini-field"><span>数量</span><strong>${trim(pos.qty, 4)} ${pos.baseAsset}</strong></div>
                <div class="mini-field"><span>成本均价</span><strong>${fmt(pos.avgPrice, 5)}</strong></div>
                <div class="mini-field"><span>标记价格</span><strong>${fmt(pos.markPrice, 5)}</strong></div>
                <div class="mini-field"><span>未实现盈亏</span><strong class="${pnlClass(pos.unrealizedPnl)}">${signed(pos.unrealizedPnl, 2)} USDT</strong></div>
              </div>
            </article>`).join("") : `<div class="empty">暂无模拟持仓</div>`}
          </div>
        </div>
      </section>
      <section class="panel">
        <div class="section-head"><h2>模拟流水</h2><span class="note">按公开订单推演</span></div>
        <div class="section-body sim-ledger">
          ${(sim.events || []).length ? sim.events.slice(0, 20).map((event) => `<article class="sim-event">
            <strong>${event.title}${event.pnl ? ` · <span class="${pnlClass(event.pnl)}">${signed(event.pnl, 2)} USDT</span>` : ""}</strong>
            <span>${event.detail} · ${dt(event.time)}</span>
          </article>`).join("") : `<div class="empty">暂无模拟流水</div>`}
        </div>
      </section>`;
      $("#stopSim")?.addEventListener("click", stopSimulation);
      $("#resumeSim")?.addEventListener("click", resumeSimulation);
      $("#resetSim")?.addEventListener("click", resetSimulation);
    }

    function bindSimulatorSetup() {
      $$("[data-follow-mode]").forEach((button) => {
        button.addEventListener("click", () => setFollowMode(button.dataset.followMode));
      });
      setFollowMode("proportional");
      bindRangeLabel("simAccountTakeProfit");
      bindRangeLabel("simAccountStopLoss");
      bindRangeLabel("simMaxDrawdown");
      bindRangeLabel("simPositionTakeProfit");
      bindRangeLabel("simPositionStopLoss");
      bindRangeLabel("simTrailingStop");
      $("#startSim")?.addEventListener("click", startSimulation);
    }

    function setFollowMode(mode) {
      $$("[data-follow-mode]").forEach((button) => button.classList.toggle("active", button.dataset.followMode === mode));
      const fixedFields = $("#fixedModeFields");
      if (fixedFields) fixedFields.hidden = mode !== "fixed";
      const note = $("#followModeNote");
      if (note) {
        note.textContent = mode === "fixed"
          ? "每次新开仓都使用相同的 USDT 预算，适合不想跟随交易员仓位大小波动的模拟。"
          : "按你的资金与带单员保证金比例缩放仓位，适合想尽量贴近交易员仓位结构的模拟。";
      }
    }

    function bindRangeLabel(id) {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      if (!input || !output) return;
      const update = () => { output.textContent = num(input.value) > 0 ? `${trim(input.value, 0)}%` : "关闭"; };
      input.addEventListener("input", update);
      update();
    }

    function renderActive() {
      if (activeTab === "performance") renderPerformance();
      if (activeTab === "positions") renderPositions();
      if (activeTab === "history") renderHistory();
      if (activeTab === "records") renderRecords();
      if (activeTab === "simulator") renderSimulator();
    }
    function render(data) { snapshot = data; processSimulation(data); renderHeader(data); renderActive(); }
    async function loadSnapshot() { const response = await fetch(`/api/snapshot?portfolioId=${encodeURIComponent(activePortfolioId)}&t=${Date.now()}`, { cache: "no-store" }); render(await response.json()); }
    async function pollNow() { const button = $("#pollBtn"); button.disabled = true; try { const response = await fetch(`/api/poll?portfolioId=${encodeURIComponent(activePortfolioId)}&t=${Date.now()}`, { cache: "no-store" }); render(await response.json()); } finally { button.disabled = false; } }
    function syncTabs() { $$(".tab").forEach((item) => item.classList.toggle("active", item.dataset.tab === activeTab)); }
    syncTabs();
    $$(".tab").forEach((tab) => tab.addEventListener("click", () => { activeTab = tab.dataset.tab; syncTabs(); renderActive(); }));
    $("#menuBtn").addEventListener("click", () => $("#traderMenu").classList.toggle("open"));
    document.addEventListener("click", (event) => {
      if (!event.target.closest("#menuBtn") && !event.target.closest("#traderMenu")) $("#traderMenu").classList.remove("open");
    });
    $("#pollBtn").addEventListener("click", pollNow);
    $("#scrollTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    loadTraders().then(loadSnapshot);
    setInterval(loadSnapshot, 20_000);
  </script>
</body>
</html>
